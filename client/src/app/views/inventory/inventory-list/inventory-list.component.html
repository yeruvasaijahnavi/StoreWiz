<table cTable hover class="table table-bordered table-striped">
	<thead class="table-primary">
		<tr>
			<th scope="col">SKU</th>
			<th scope="col">Name</th>
			<th scope="col">Category</th>
			<th scope="col">Description</th>
			<th scope="col">Quantity</th>
			<th scope="col">Price</th>
			<th scope="col">Location</th>
			<th scope="col">Actions</th>
		</tr>
	</thead>
	<tbody>
		<tr
			*ngFor="
				let item of inventoryList
					| paginate
						: {
								itemsPerPage: itemsPerPage,
								currentPage: currentPage
						  }
			"
			class="table-row-hover"
		>
			<td>{{ item.sku }}</td>
			<td>{{ item.name }}</td>
			<td>{{ item.category }}</td>
			<td>{{ item.description }}</td>
			<td>{{ item.quantity }}</td>
			<td>{{ item.price | currency }}</td>
			<td>{{ item.location }}</td>
			<td>
				<span class="d-flex align-items-center gap-2">
					<span
						class="text-info"
						title="View"
						(click)="viewInventoryItem(item.sku)"
					>
						<svg cIcon name="cil-description"></svg>
					</span>
					<span
						*ngIf="isRole('admin')"
						class="text-warning"
						title="Update"
						(click)="updateInventoryItem(item.sku)"
					>
						<svg cIcon name="cil-pencil"></svg>
					</span>
					<span
						*ngIf="isRole('admin')"
						class="text-danger"
						title="Delete"
						(click)="deleteInventoryItem(item.sku)"
					>
						<svg cIcon name="cil-trash"></svg>
					</span>
				</span>
			</td>
		</tr>
	</tbody>
</table>

<!-- Pagination Controls -->
<div class="d-flex justify-content-center mt-3">
	<pagination-controls
		(pageChange)="currentPage = $event"
	></pagination-controls>
</div>
