<div class="container">
	<h2>Staff List</h2>

	<div class="d-flex justify-content-between align-items-center mb-3">
		<button
			class="btn btn-primary"
			(click)="router.navigate(['/staff/add'])"
		>
			Add Staff Member
		</button>
	</div>

	<table cTable hover class="table table-bordered table-striped">
		<thead class="table-primary">
			<tr>
				<th scope="col">Staff ID</th>
				<th scope="col">Name</th>
				<th scope="col">Email</th>
				<th scope="col">Role</th>
				<th scope="col">Shift</th>
				<th scope="col">Status</th>
				<th scope="col">Actions</th>
			</tr>
		</thead>
		<tbody>
			<tr
				*ngFor="
					let staff of staffList
						| paginate
							: {
									itemsPerPage: itemsPerPage,
									currentPage: currentPage
							  }
				"
				class="table-row-hover"
			>
				<td>{{ staff.staffId }}</td>
				<td>{{ staff.name }}</td>
				<td>{{ staff.email }}</td>
				<td>{{ staff.role }}</td>
				<td>{{ staff.shift }}</td>
				<td>{{ staff.status }}</td>
				<td>
					<span class="d-flex align-items-center gap-2">
						<span
							class="text-info"
							title="View"
							(click)="viewStaffDetails(staff.staffId)"
						>
							<svg cIcon name="cil-description"></svg>
						</span>
						<span
							class="text-warning"
							title="Update"
							(click)="updateStaffMember(staff.staffId)"
						>
							<svg cIcon name="cil-pencil"></svg>
						</span>
						<span
							class="text-danger"
							title="Delete"
							(click)="deleteStaffMember(staff.staffId)"
						>
							<svg cIcon name="cil-trash"></svg>
						</span>
					</span>
				</td>
			</tr>
		</tbody>
	</table>

	<div class="d-flex justify-content-center mt-3">
		<pagination-controls
			(pageChange)="currentPage = $event"
		></pagination-controls>
	</div>
</div>
