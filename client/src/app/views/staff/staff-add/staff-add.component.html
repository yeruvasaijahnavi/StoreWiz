<div class="container mt-4">
	<h2 class="mb-4">Add Staff Member</h2>
	<form (ngSubmit)="addStaffMember()" class="row g-3">
		<div class="col-md-6 form-floating">
			<input
				id="name"
				type="text"
				class="form-control"
				[(ngModel)]="newStaff.name"
				name="name"
				required
			/>
			<label for="name">Name</label>
		</div>

		<div class="col-md-6 form-floating">
			<input
				id="email"
				type="email"
				class="form-control"
				[(ngModel)]="newStaff.email"
				name="email"
				required
			/>
			<label for="email">Email</label>
		</div>

		<div class="col-md-4 form-floating">
			<select
				id="role"
				class="form-select"
				[(ngModel)]="newStaff.role"
				name="role"
				required
			>
				<option *ngFor="let role of roles" [value]="role">
					{{ role }}
				</option>
			</select>
			<label for="role">Role</label>
		</div>

		<div class="col-md-4 form-floating">
			<select
				id="shift"
				class="form-select"
				[(ngModel)]="newStaff.shift"
				name="shift"
				required
			>
				<option *ngFor="let shift of shifts" [value]="shift">
					{{ shift }}
				</option>
			</select>
			<label for="shift">Shift</label>
		</div>

		<div class="col-md-4 form-floating">
			<select
				id="status"
				class="form-select"
				[(ngModel)]="newStaff.status"
				name="status"
				required
			>
				<option *ngFor="let status of statuses" [value]="status">
					{{ status }}
				</option>
			</select>
			<label for="status">Status</label>
		</div>

		<div class="col-12">
			<button type="submit" class="btn btn-primary">
				Add Staff Member
			</button>
		</div>
	</form>
</div>
